<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a111c"><link rel="manifest" href="manifest.webmanifest"><title>RunLab · Træningsanalyse</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#0a111c;color:#eaf1f8}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}aside{position:fixed;width:238px;height:100vh;padding:27px 17px;background:#0e1825;border-right:1px solid #263448}.logo{font-weight:800;font-size:25px;letter-spacing:-1px;padding:8px 12px 34px}.logo span{color:#45d6a7}.nav{display:block;width:100%;padding:13px 14px;margin:5px 0;border:0;background:transparent;color:#a7b7c9;text-align:left;border-radius:10px}.nav.active,.nav:hover{background:#1d3140;color:#e9fff7}.aside-foot{position:absolute;bottom:24px;font-size:12px;color:#7c90a5;padding:12px}main{margin-left:238px;max-width:1600px;padding:34px 42px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}h1{font-size:31px;letter-spacing:-1px;margin:0}p.sub{color:#8da3b7;margin:7px 0 28px}.btn{background:#43d5a3;color:#08251b;border:0;border-radius:10px;padding:11px 16px;font-weight:750}.btn.secondary{background:#1e3142;color:#cce3ee}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:#111f2e;border:1px solid #26384a;border-radius:15px;padding:20px}.statlabel{font-size:13px;color:#91a8ba}.statvalue{font-size:30px;font-weight:760;letter-spacing:-1px;margin:13px 0 4px}.unit{color:#829caf;font-size:13px}.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:16px;margin-top:17px}.card h2{font-size:17px;margin:0 0 16px}.graph{width:100%;height:230px;display:block}.muted{color:#89a2b4}.small{font-size:12px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:14px 10px;text-align:left;border-bottom:1px solid #263849;white-space:nowrap}th{color:#8fa8bb;font-weight:500}.tag{font-size:11px;border-radius:7px;padding:5px 8px;background:#253e4d;color:#9ce8d1}.upload{border:2px dashed #345468;border-radius:14px;padding:35px;text-align:c </style></head><body><aside><div class="logo">RUN<span>LAB</span></div><button class="nav active" data-view="dashboard">◫ &nbsp; Dashboard</button><button class="nav" data-view="history">◷ &nbsp; Træningshistorik</button><button class="nav" data-view="analysis">⌁ &nbsp; Analyse</button><button class="nav" data-view="goals">◇ &nbsp; Mål & rekorder</button><button class="nav" data-view="import">⇧ &nbsp; Importer</button><div class="aside-foot">RUNLAB 0.3 · Lokal datalagring</div></aside><main><div class="top"><div><h1 id="heading">Din træningsudvikling</h1><p class="sub" id="subtitle">Alle dine løbeture. Én samlet oversigt.</p></div><div class="toolbar"><button class="btn secondary" id="export">↓ Eksportér data</button><button class="btn" id="uploadBtn">+ Importér træning</button></div></div><div id="view"></div><div id="notice" aria-live="polite"></div></main><input type="file" id="files" accept=".json,.fit,.tcx,.gpx" multiple hidden><script src="app.js"></script></body></html>
